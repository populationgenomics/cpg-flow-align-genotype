[workflow]
input_cohorts = []

skip_stages = []

sequencing_type = '' #required
sequencing_technology = 'short-read' # This repo is intended to process short-read sequencing data
populate_assays = true

# set this to false if we want to use non-preemptible machines
align_spot = true

# exome/genome workflows choose one of these default values
exome_realignment_shards = 1
genome_realignment_shards = 6

# number of threads to use for alignment, defaulting to 16
#align_threads = 16

# number of threads to use for merging, defaulting to 8
#merge_threads = 8

# to manually set the resources of align jobs
#align_memory = 'highmem'
#align_storage = 100

# amount of storage space required - once free storage dips below this limit, the job will be killed
align_buffer_kb = 2097152

# set to use highmem workers for picard qc metrics jobs, defaults to false
picard_metrics_use_highmem = false
picard_metrics_ncpu = 2
picard_metrics_mem_gb = 8

# used to make sure we don't repeat previously completed stages
check_expected_outputs = true

# the method to register outputs, can be missing - will not generate metamist analysis entries
status_reporter = 'metamist'

# defaults for the storage to attach to QC jobs for the CRAM file
exome_cram_gb = 20
genome_cram_gb = 100

# for HaplotypeCaller
# Maximum number of reads to retain per alignment start position. Reads above this threshold will be downsampled. Set to 0 to disable.
downsample_reads = 20

# Shard count for HaplotypeCaller
scatter_count_genotype = 30

# HaplotypeCaller resource options
# Best performance for genomes - highmem, 4 cpus, 4 pairhmm threads
haplotypecaller_cpu = 4
haplotypecaller_machine_type = 'highmem'
pairhmm_threads = 4

# attached storage for haplotypecaller jobs, defaulting to 40 for Genomes, and None for other seqencing_types
#haplotypecaller_storage = 100

# storage required for the post-processing of the gVCF files
postproc_gvcf_storage = 20

# Experimentally validated best reblocking bands for GATK ReblockGVCF, from seqr-loader config
reblock_gq_bands = [13, 20, 30, 40]

# Overrides for the MultiQC and SomalierPedigree stages
[workflow.somalier_pedigree]
send_to_slack = true

[workflow.cram_multiqc]
send_to_slack = true
[workflow.cram_multiqc.extra_config]
plots_force_interactive = true

[workflow.gvcf_multiqc]
send_to_slack = true
[workflow.gvcf_multiqc.extra_config]
plots_force_interactive = true

[workflow.sg_qc_report]
send_to_slack = true

[qc_thresholds]
# QC thresholds are keyed by sequencing_type (genome/exome) and severity tier
# (fail/warn). A metric is flagged when it falls below its `.under` threshold or
# rises above its `.over` threshold.
# Metric keys must match the keys MultiQC surfaces in `report_general_stats_data`
# Note that some samtools stats metrics use integer thresholds to represent percentages (e.g. 97 = 97%);
# while Picard and VerifyBamID use floats (e.g. 0.85 = 85%).
# See README.md for more details on these thresholds.

# Genome minimum thresholds (flag if metrics below these values)
[qc_thresholds.genome.warn.under]
"MEDIAN_COVERAGE" = 25
"PCT_20X" = 0.85
"reads_mapped_percent" = 97
"reads_properly_paired_percent" = 92

[qc_thresholds.genome.fail.under]
"MEDIAN_COVERAGE" = 15
"PCT_20X" = 0.75
"reads_mapped_percent" = 80
"reads_properly_paired_percent" = 90

# Genome maximum thresholds (flag if metrics above these values)
[qc_thresholds.genome.warn.over]
"reads_duplicated_percent" = 30
"FREEMIX" = 0.02

[qc_thresholds.genome.fail.over]
"reads_duplicated_percent" = 40
"FREEMIX" = 0.04

# Exome minimum thresholds (flag if metrics below these values)
[qc_thresholds.exome.warn.under]
"MEAN_TARGET_COVERAGE" = 50
"PCT_TARGET_BASES_20X" = 0.90
"reads_mapped_percent" = 95

[qc_thresholds.exome.fail.under]
"MEAN_TARGET_COVERAGE" = 30
"PCT_TARGET_BASES_20X" = 0.80
"reads_mapped_percent" = 90

# Exome maximum thresholds (flag if metrics above these values)
[qc_thresholds.exome.warn.over]
"FOLD_80_BASE_PENALTY" = 2.5
"ZERO_CVG_TARGETS_PCT" = 0.07
"reads_duplicated_percent" = 30
"FREEMIX" = 0.02

[qc_thresholds.exome.fail.over]
"FOLD_80_BASE_PENALTY" = 3.5
"ZERO_CVG_TARGETS_PCT" = 0.10
"reads_duplicated_percent" = 50
"FREEMIX" = 0.04


