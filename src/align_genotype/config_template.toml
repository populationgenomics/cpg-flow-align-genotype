[vntyper]
# Logs are very slim when set to INFO
log_level = "DEBUG"
# gs:// path to configs that override the VNtyper / kestrel defaults
vntyper_config_json_path = false
kestrel_config_json_path = false

vntyper_projects = []
skip_sgids = []
fast = false
